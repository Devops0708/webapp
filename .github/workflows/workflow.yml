name: PipelineWorkFlow

on:
  push:
      branches:
         - main
  pull_request:
      branches:
         - main  
         
jobs:
    build:
        name: Azure Pipeline
        runs-on: ubuntu-latest
        steps:
           - name: Azure Pipelines Actions
             uses: Azure/pipelines@v1
             with:
               azure-devops-project-url: https://dev.azure.com/r52854695/AgileProject
               azure-pipeline-name: 'WebApplicationrohit'
               azure-devops-token: ${{ secrets.AZURE_DEVOPS_TOKEN}}
